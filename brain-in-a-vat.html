<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>통 속의 뇌</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --page-margin: 34px;
  --bg: #ffffff;
  --surface: #fffdf8;
  --surface-soft: rgba(255,255,255,0.86);
  --text: #262626;
  --muted: #819082;
  --green: #93c974;
  --green-deep: #62894e;
  --blue: #35a9ff;
  --cream: #f8f4eb;
  --shadow: 0 24px 60px rgba(20,71,38,0.22);
  --line: rgba(39,39,39,0.08);
}

body {
  min-height: 100vh;
  background: #dededc;
  font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 34px;
  user-select: none;
  overflow: hidden;
  color: var(--text);
}

.web-page {
  width: min(1180px, calc(100vw - 68px));
  height: min(820px, calc(100vh - 68px));
  min-height: 660px;
  position: relative;
  overflow: hidden;
  border-radius: 34px;
  background:
    radial-gradient(circle at 52% 36%, #ffffff 0%, #f8f8f7 42%, #efefed 100%);
  box-shadow: 0 26px 70px rgba(0,0,0,0.13);
  display: grid;
  grid-template-rows: 84px 1fr 244px;
  padding: 0 var(--page-margin) 32px;
}

.side-nav {
  position: absolute;
  top: 42px; left: var(--page-margin);
  z-index: 6;
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 0.78rem;
  font-weight: 650;
  color: #8a8a86;
}
.side-nav strong {
  color: #151515;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.side-nav strong::after {
  content: '';
  width: 22px; height: 22px;
  border-radius: 50%;
  background: #101010;
  box-shadow: inset -5px -5px 0 rgba(255,255,255,0.08);
}

.top-brand {
  position: absolute;
  top: 42px; left: 50%;
  transform: translateX(-50%);
  z-index: 6;
  font-size: 0.78rem;
  font-weight: 900;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.top-icons {
  position: absolute;
  top: 38px; right: var(--page-margin);
  z-index: 6;
  display: flex;
  flex-direction: column;
  gap: 14px;
  color: #222;
}
.top-icons span {
  width: 18px; height: 18px;
  display: grid;
  place-items: center;
  font-size: 1rem;
  line-height: 1;
}

.hero-word {
  position: absolute;
  left: var(--page-margin);
  right: var(--page-margin);
  top: 192px;
  z-index: 1;
  font-size: 8rem;
  line-height: 0.82;
  font-weight: 950;
  letter-spacing: 0;
  color: rgba(17,17,17,0.93);
  white-space: nowrap;
  pointer-events: none;
}
.hero-word.is-message {
  max-width: calc(100% - var(--page-margin) * 2);
  font-size: clamp(3.1rem, 6vw, 5.9rem);
  line-height: 0.96;
  white-space: normal;
  text-wrap: balance;
  text-align: left;
}
.hero-word.msg-salty {
  top: 126px;
  right: auto;
  max-width: min(430px, 43%);
  font-size: clamp(3rem, 5.6vw, 5.4rem);
}
.hero-word.msg-sweet {
  top: 124px;
  right: auto;
  max-width: min(430px, 42%);
  font-size: clamp(3rem, 5.5vw, 5.3rem);
}
.hero-word.msg-spicy {
  top: 106px;
  right: auto;
  max-width: min(620px, 58%);
  font-size: clamp(3rem, 5.2vw, 5rem);
}
.hero-word.msg-bitter {
  top: 96px;
  right: auto;
  max-width: min(600px, 56%);
  font-size: clamp(2.55rem, 4.85vw, 4.7rem);
  line-height: 0.92;
}
.hero-word.msg-sour {
  top: 132px;
  right: auto;
  max-width: min(420px, 40%);
  font-size: clamp(3rem, 5.6vw, 5.4rem);
}
.hero-word.is-typing::after {
  content: '';
  display: inline-block;
  width: 0.08em;
  height: 0.74em;
  margin-left: 0.08em;
  background: currentColor;
  vertical-align: -0.03em;
  animation: title-caret 0.72s steps(1) infinite;
}
@keyframes title-caret {
  0%, 48% { opacity: 1; }
  49%, 100% { opacity: 0; }
}

.scene-backdrop {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  border-radius: inherit;
  background: transparent;
  pointer-events: none;
}
.scene-backdrop::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 30;
  background:
    radial-gradient(circle at 50% 47%, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.42) 46%, rgba(255,255,255,0.72) 100%),
    linear-gradient(90deg, rgba(255,255,255,0.48), rgba(255,255,255,0.04) 42%, rgba(255,255,255,0.34));
}
.scene-backdrop .sc {
  inset: -1px;
}
.scene-backdrop .sc-idle {
  background: transparent;
}
.scene-backdrop .idle-cursor {
  display: none;
}
.scene-backdrop .sc-tag {
  top: 126px;
  left: 44px;
  font-size: 0.68rem;
  background: rgba(255,255,255,0.58);
}
.scene-backdrop .sc-emoji {
  font-size: clamp(7rem, 19vw, 18rem);
  opacity: 0.16;
  filter: blur(0.2px) saturate(0.95);
}
.scene-object {
  position: absolute;
  z-index: 4;
  display: grid;
  place-items: center;
  pointer-events: none;
  filter: drop-shadow(0 16px 28px rgba(0,0,0,0.12));
  will-change: transform, opacity;
}
.scene-bubble {
  font-size: clamp(2.1rem, 5.4vw, 5.7rem);
  line-height: 1;
}
.scene-line {
  position: absolute;
  z-index: 3;
  height: 2px;
  width: clamp(120px, 18vw, 260px);
  border-radius: 999px;
  background: rgba(255,255,255,0.5);
  transform-origin: center;
  animation: scene-slide linear infinite;
}
@keyframes scene-float {
  0%,100% { transform: translate3d(0,0,0) rotate(var(--rot, 0deg)); }
  50% { transform: translate3d(var(--dx, 0px), var(--dy, -18px), 0) rotate(calc(var(--rot, 0deg) + 5deg)); }
}
@keyframes scene-slide {
  from { transform: translateX(-18vw) rotate(var(--rot, 0deg)); opacity: 0; }
  18%,80% { opacity: 1; }
  to { transform: translateX(118vw) rotate(var(--rot, 0deg)); opacity: 0; }
}
.scene-backdrop .drop {
  width: 2px;
  height: 28px;
  opacity: 0.7;
}
.scene-backdrop .firework {
  opacity: 0.72;
}
.scene-backdrop .glow-center {
  width: 260px;
  height: 260px;
}
.scene-backdrop .pulse-ring {
  width: 130px !important;
  height: 130px !important;
}
.scene-backdrop .news-bar {
  bottom: 42px;
  left: 42px;
  right: 42px;
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 0.7rem;
}
.scene-backdrop .shower-label {
  bottom: 92px;
  font-size: 0.72rem;
}

.glow {
  position: fixed;
  width: min(560px, 78vw); height: 110px;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(0,0,0,0.09) 0%, rgba(0,0,0,0.035) 48%, transparent 72%);
  top: 53%; left: 50%;
  transform: translate(-50%,-50%) scaleX(1.08);
  pointer-events: none;
  transition: background 1.2s ease;
  z-index: 0;
}

header {
  left: 42px;
  bottom: 294px;
  position: absolute;
  z-index: 5;
  color: var(--text);
  align-self: end;
}
header h1 { font-size: 0.86rem; font-weight: 900; color: #101010; letter-spacing: 0; }
header p  { max-width: 230px; font-size: 0.72rem; color: #7f7f7a; margin-top: 8px; font-weight: 650; line-height: 1.45; }

/* ── Arena ── */
.arena {
  grid-row: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 2;
  width: 100%;
  min-height: 0;
}

.stage {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 34px;
  flex-wrap: wrap;
  transform: translateY(18px);
}

/* ── Monitor ── */
.monitor {
  display: none;
  flex-direction: column;
  align-items: center;
  width: 0;
  overflow: visible;
  opacity: 0;
  transform: translateX(-20px) scale(0.9);
  pointer-events: none;
  transition: width 0.55s ease, opacity 0.55s ease, transform 0.55s cubic-bezier(0.34,1.56,0.64,1);
}
.monitor.visible { width: 160px; opacity: 1; transform: none; }
.m-body {
  background: #161616;
  border-radius: 28px;
  padding: 12px 10px 14px;
  width: 160px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,0.08),
    inset 0 -8px 18px rgba(255,255,255,0.05),
    0 18px 40px rgba(0,0,0,0.25);
}
.m-screen {
  width: 138px; height: 122px;
  border-radius: 20px;
  overflow: hidden;
  position: relative;
  background: #eef8ff;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
}
.m-screen::before {
  content: '';
  position: absolute;
  top: 7px; left: 50%;
  width: 44px; height: 12px;
  border-radius: 999px;
  background: #080808;
  transform: translateX(-50%);
  z-index: 20;
}
.m-footer { display: flex; align-items: center; justify-content: center; width: 100%; }
.m-cam {
  width: 32px; height: 3px;
  border-radius: 50%;
  background: rgba(255,255,255,0.36);
  box-shadow: none;
  opacity: 0.9;
}
.m-neck,
.m-base { display: none; }

/* ── Brain area ── */
.brain-area {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 44px;
}
.state-badge {
  position: absolute;
  top: 2px; left: 50%;
  transform: translateX(-50%);
  font-size: 1.16rem;
  font-weight: 900;
  letter-spacing: 0.04em;
  color: #6f6f6b;
  white-space: nowrap;
  transition: color 0.7s ease;
  text-transform: uppercase;
}
.brain-container {
  position: relative;
  width: min(470px, 82vw); height: min(390px, 68vw);
  filter: drop-shadow(0 28px 34px rgba(0,0,0,0.12));
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}
.brain-container.drag-over  { transform: scale(1.07); }
.brain-container.scrub-mode { cursor: none; }

/* Blue tint while scrubbing */
.brain-container.scrubbing .brain-svg,
.brain-container.scrubbing .brain-character-img {
  filter: drop-shadow(0 8px 28px rgba(77,208,225,0.65)) !important;
  transition: filter 0.1s ease !important;
}

.brain-svg {
  display: none;
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  overflow: visible;
  filter: drop-shadow(0 16px 28px rgba(133,45,61,0.28));
  transition: filter 0.9s ease;
  pointer-events: none;
}
.brain-svg.fallback-visible { display: block; }
.brain-character-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  visibility: hidden;
  filter: drop-shadow(0 16px 28px rgba(0,0,0,0.12));
  transition: filter 0.9s ease, transform 0.9s ease;
  pointer-events: none;
  -webkit-user-drag: none;
  -webkit-user-select: none;
  user-select: none;
}
.brain-character-img.is-loaded { visibility: visible; }
.brain-character-img.is-fallback {
  display: none;
}
.brain-container.state-overstimulated .brain-character-img {
  filter: drop-shadow(0 16px 28px rgba(201,87,24,0.18));
}
.brain-container.state-rotten .brain-character-img {
  filter: drop-shadow(0 16px 28px rgba(72,104,28,0.18));
}
.brain-container.state-overstimulated.scrubbing .brain-character-img {
  filter: drop-shadow(0 8px 28px rgba(77,208,225,0.65)) !important;
}
.brain-container.state-rotten.scrubbing .brain-character-img {
  filter: drop-shadow(0 8px 28px rgba(77,208,225,0.65)) !important;
}
.reaction-msg {
  position: absolute;
  top: -46px; left: 50%;
  transform: translateX(-50%) translateY(6px);
  background: var(--surface);
  border-radius: 999px;
  padding: 7px 16px;
  font-size: 0.74rem;
  color: var(--text);
  white-space: nowrap;
  box-shadow: 0 14px 34px rgba(35,77,47,0.2);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  z-index: 10;
}
.reaction-msg.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.dots {
  position: absolute;
  bottom: -24px; left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 7px;
}
.dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: rgba(255,255,255,0.34);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.24);
  transition: background 0.4s ease, transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
.dot.fed        { background: #ffd0dc; transform: scale(1.15); }
.dot.fed.hot    { background: #ff8c42; }
.dot.fed.rotten { background: #9ac041; }

.ripple {
  position: absolute;
  top: 50%; left: 50%;
  width: 130px; height: 130px;
  border-radius: 50%;
  border: 2px solid currentColor;
  opacity: 0;
  pointer-events: none;
  animation: ripple-out 0.65s ease-out forwards;
}
@keyframes ripple-out {
  0%  { transform: translate(-50%,-50%) scale(0); opacity: 0.6; }
  100%{ transform: translate(-50%,-50%) scale(2); opacity: 0;   }
}

/* ── Tray ── */
.tray {
  width: 100%;
  max-width: none;
  background: rgba(255,255,255,0.68);
  border-radius: 26px;
  padding: 14px 18px 16px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.82), 0 18px 42px rgba(0,0,0,0.08);
  position: relative;
  z-index: 1;
  border: 1px solid rgba(20,20,20,0.05);
  min-width: 0;
}

/* Tabs */
.tab-bar {
  display: flex;
  gap: 7px;
  background: rgba(238,238,233,0.92);
  border-radius: 20px;
  padding: 4px;
  margin-bottom: 12px;
}
.tab-btn {
  flex: 1;
  padding: 10px 6px;
  border: none;
  border-radius: 14px;
  background: transparent;
  font-size: 0.84rem;
  font-weight: 850;
  color: #8d9b8d;
  cursor: pointer;
  transition: background 0.2s, color 0.2s, box-shadow 0.2s;
}
.tab-btn.active {
  background: #111;
  color: var(--text);
  color: #fff;
  box-shadow: 0 8px 18px rgba(0,0,0,0.12);
}

.tab-panel { display: block; }
.tab-panel.hidden { display: none; }

/* Food items */
.items-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: clamp(12px, 3vw, 32px);
}
.food-item {
  flex: 1;
  max-width: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  cursor: grab;
}
.food-item:active { cursor: grabbing; }
.food-icon {
  width: auto;
  aspect-ratio: auto;
  max-width: none;
  border-radius: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.95rem;
  line-height: 1;
  background: transparent;
  box-shadow: none;
  transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
}
.food-item:hover .food-icon {
  transform: translateY(-5px) scale(1.06);
}
.food-label    { font-size: 0.78rem; font-weight: 850; color: #464b46; text-align: center; white-space: nowrap; }
.food-sublabel { font-size: 0.58rem; color: #a9b1a8; text-align: center; margin-top: -3px; }

/* ── Shower panel ── */
.shower-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 6px 0 2px;
}
.shower-hint {
  font-size: 0.9rem;
  color: #718271;
  font-weight: 800;
  letter-spacing: 0.01em;
}
.sp-dots {
  display: flex;
  gap: 10px;
  align-items: center;
}
.sp-dot {
  width: 17px; height: 17px;
  border-radius: 50%;
  background: #eef5e8;
  border: 2px solid #d8e6cf;
  transition: background 0.35s ease, transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.35s ease;
}
.sp-dot.filled {
  background: var(--blue);
  border-color: #0d90df;
  transform: scale(1.25);
  box-shadow: 0 0 10px rgba(53,169,255,0.45);
}

.bottom-deck {
  grid-row: 3;
  position: relative;
  z-index: 5;
  display: block;
  width: 100%;
  align-self: center;
  margin: 0 auto;
}

@media (max-width: 860px) {
  body {
    padding: 0;
    overflow: auto;
    align-items: stretch;
    justify-content: flex-start;
  }
  .web-page {
    --page-margin: 18px;
    width: 100%;
    min-height: 100vh;
    height: auto;
    border-radius: 0;
    grid-template-rows: 84px 480px auto;
    padding: 0 18px 22px;
  }
  .side-nav { display: none; }
  .top-brand { top: 24px; }
  .top-icons {
    top: 20px;
    right: 18px;
    flex-direction: row;
  }
  .hero-word {
    top: 164px;
    left: var(--page-margin);
    right: var(--page-margin);
    font-size: 4.3rem;
  }
  .hero-word.is-message {
    top: 132px;
    left: var(--page-margin);
    right: var(--page-margin);
    max-width: calc(100% - var(--page-margin) * 2);
    text-align: left;
    font-size: clamp(2.6rem, 12vw, 4.1rem);
    line-height: 0.94;
  }
  header {
    left: 18px;
    bottom: auto;
    top: 84px;
  }
  .stage {
    transform: translateY(22px);
  }
  .monitor.visible {
    width: 130px;
  }
  .m-body {
    width: 130px;
    border-radius: 24px;
  }
  .m-screen {
    width: 110px;
    height: 100px;
  }
  .bottom-deck {
    width: 100%;
  }
}

/* ══════════════════════════════════════
   BRUSH CURSOR
══════════════════════════════════════ */
.brush-el {
  position: fixed;
  pointer-events: none;
  z-index: 9998;
  display: none;
  flex-direction: column;
  align-items: center;
  width: 58px;
  /* Bottom of element (bristle tips) positioned at cursor via JS */
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.22));
  transition: transform 0.08s ease;
}
.brush-el.show { display: flex; }

.b-handle {
  width: 11px; height: 50px;
  background: linear-gradient(to right, #7a5530 15%, #d4a86a 45%, #d4a86a 55%, #7a5530 85%);
  border-radius: 5px 5px 2px 2px;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
}
.b-ferrule {
  width: 20px; height: 8px;
  background: linear-gradient(to bottom, #d0d0d0, #909090);
  border-radius: 2px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.18);
}
.b-head {
  width: 58px; height: 22px;
  background: linear-gradient(to bottom, #f5e8a0, #c8a040);
  border-radius: 5px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 3px 10px rgba(0,0,0,0.18);
}
/* Highlight */
.b-head::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 7px;
  background: linear-gradient(to bottom, rgba(255,255,255,0.38), transparent);
  border-radius: 5px 5px 0 0;
}
/* Bristle lines */
.b-head::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 9px;
  background: repeating-linear-gradient(
    90deg,
    rgba(80,50,10,0.6) 0px, rgba(80,50,10,0.6) 2px,
    rgba(200,160,60,0.2) 2px, rgba(200,160,60,0.2) 5px
  );
}

/* ── Foam particles ── */
.foam-dot {
  position: fixed;
  border-radius: 50%;
  background: white;
  pointer-events: none;
  z-index: 9990;
  box-shadow: 0 0 5px rgba(100,210,240,0.6);
  animation: foam-rise ease-out forwards;
}
@keyframes foam-rise {
  0%  { transform: translateY(0) scale(1);    opacity: 0.9; }
  100%{ transform: translateY(-24px) scale(0.15); opacity: 0; }
}

/* ══════════════════════════════════════
   BRAIN ANIMATIONS
══════════════════════════════════════ */
@keyframes idle-normal { 0%,100%{transform:scale(1)} 50%{transform:scale(1.018)} }
@keyframes idle-over   { 0%,100%{transform:scale(1)} 50%{transform:scale(1.032)} }
@keyframes idle-rotten {
  0%,100%{transform:rotate(0deg)}
  30%    {transform:rotate(1.8deg) scale(0.987)}
  70%    {transform:rotate(-1.8deg) scale(0.993)}
}
@keyframes do-bounce {
  0%  {transform:translateY(0) scale(1)}
  25% {transform:translateY(4px) scale(0.94,1.06)}
  55% {transform:translateY(-24px) scale(1.06,0.94)}
  75% {transform:translateY(-8px)}
  90% {transform:translateY(-2px)}
  100%{transform:translateY(0) scale(1)}
}
@keyframes do-shake {
  0%,100%{transform:rotate(0)}
  12%{transform:rotate(-5deg) translateX(-5px)}
  28%{transform:rotate(5deg)  translateX(6px)}
  44%{transform:rotate(-4deg) translateX(-4px)}
  60%{transform:rotate(4deg)  translateX(4px)}
  76%{transform:rotate(-2deg) translateX(-2px)}
  90%{transform:rotate(2deg)  translateX(2px)}
}
@keyframes do-twitch {
  0%,100%{transform:rotate(0) scale(1)}
  15%{transform:rotate(6deg)  scale(1.05)}
  30%{transform:rotate(-6deg) scale(1.07)}
  48%{transform:rotate(5deg)  scale(1.04)}
  65%{transform:rotate(-3deg) scale(1.05)}
  80%{transform:rotate(2deg)  scale(1.02)}
}
@keyframes do-droop {
  0%  {transform:scale(1)}
  30% {transform:scaleY(0.87) scaleX(1.07) translateY(7px)}
  60% {transform:scaleY(0.94) scaleX(1.03) translateY(3px)}
  80% {transform:scaleY(0.98) translateY(1px)}
  100%{transform:scale(1)}
}
@keyframes do-jolt {
  0%,100%{transform:scale(1) rotate(0)}
  15%{transform:scale(1.19) rotate(-5deg)}
  32%{transform:scale(0.88) rotate(5deg)}
  52%{transform:scale(1.11) rotate(-3deg)}
  72%{transform:scale(0.96) rotate(2deg)}
  88%{transform:scale(1.04) rotate(-1deg)}
}
@keyframes do-shower {
  0%,100%{transform:scale(1)}
  30%{transform:scale(1.07)}
  60%{transform:scale(0.96)}
  80%{transform:scale(1.04)}
}

.brain-container.state-normal         { animation: idle-normal 3s   ease-in-out infinite; }
.brain-container.state-overstimulated { animation: idle-over   1.1s ease-in-out infinite; }
.brain-container.state-rotten         { animation: idle-rotten 2.6s ease-in-out infinite; }

.brain-container.do-bounce { animation: do-bounce 0.65s cubic-bezier(0.34,1.56,0.64,1) forwards !important; }
.brain-container.do-shake  { animation: do-shake  0.7s  ease forwards !important; }
.brain-container.do-twitch { animation: do-twitch 0.75s ease forwards !important; }
.brain-container.do-droop  { animation: do-droop  0.72s ease forwards !important; }
.brain-container.do-jolt   { animation: do-jolt   0.65s ease forwards !important; }
.brain-container.do-shower { animation: do-shower 1.0s  ease forwards !important; }

/* Drag ghost */
.drag-ghost {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  font-size: 2rem;
  transform: scale(1.3) rotate(-8deg);
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.18));
}

/* ══════════════════════════════════════
   MONITOR SCENES
══════════════════════════════════════ */
.sc {
  position: absolute;
  inset: 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.sc-emoji { position: relative; z-index: 2; font-size: 2.3rem; line-height: 1; }
.sc-tag {
  position: absolute;
  top: 26px; left: 9px;
  font-size: 0.44rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 3px 7px;
  border-radius: 999px;
  z-index: 10;
  background: rgba(255,255,255,0.72);
  color: rgba(40,70,45,0.78);
}

.sc-idle {
  background:
    linear-gradient(180deg, #35a9ff 0%, #a7dcff 48%, #88be6e 49%, #4e8544 100%);
}
.idle-cursor {
  width: 54px; height: 54px;
  border-radius: 18px;
  background: rgba(255,255,255,0.6);
  color: transparent;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 10px 20px rgba(35,75,44,0.18);
  animation: blink 1.4s steps(1) infinite;
}
@keyframes blink { 50%{ opacity: 0; } }

/* Salty */
.sc-salty { background: linear-gradient(180deg, #6fc5ff 0%, #d9f3ff 50%, #6f9d55 51%, #436f38 100%); }
.sc-salty .sc-tag { background: rgba(255,255,255,0.72); color: #236692; }
.drop {
  position: absolute;
  top: -14px;
  width: 1.5px; height: 13px;
  background: rgba(110,170,255,0.5);
  border-radius: 1px;
  animation: rain-fall linear infinite;
}
@keyframes rain-fall { to { transform: translateY(125px); } }
.sc-salty .sc-emoji { animation: sad-bob 2.5s ease-in-out infinite; }
@keyframes sad-bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(5px)} }

/* Sweet */
.sc-sweet { background: linear-gradient(180deg, #44afff 0%, #b8e6ff 48%, #9ccb76 49%, #5e934a 100%); }
.sc-sweet .sc-tag { background: rgba(255,255,255,0.72); color: #7a6a00; }
.firework {
  position: absolute;
  border-radius: 50%;
  opacity: 0;
  animation: fw-burst ease-out infinite;
}
@keyframes fw-burst {
  0%  { transform: scale(0);   opacity: 0.9; }
  100%{ transform: scale(3.5); opacity: 0;   }
}
.sc-sweet .sc-emoji { animation: joy-bounce 0.55s cubic-bezier(0.34,1.56,0.64,1) infinite alternate; }
@keyframes joy-bounce { from{transform:translateY(0) scale(1)} to{transform:translateY(-9px) scale(1.1)} }

/* Spicy */
.sc-spicy { background: linear-gradient(180deg, #39aaff 0%, #e8f7ff 47%, #90bf6d 48%, #547f42 100%); }
.sc-spicy .sc-tag { background: rgba(255,255,255,0.72); color: #b24b12; }
.glow-center {
  position: absolute;
  width: 54px; height: 54px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,110,0,0.55) 0%, transparent 70%);

}
@keyframes glow-pulse {
  from{transform:scale(0.8); opacity:0.4}
  to  {transform:scale(1.5); opacity:1  }
}
.pulse-ring {
  position: absolute;
  border-radius: 50%;
  border: 2px solid rgba(255,80,0,0.45);
  animation: spicy-ring 1.1s ease-out infinite;
  opacity: 0;
}
@keyframes spicy-ring {
  0%  { transform: scale(0); opacity: 0.7; }
  100%{ transform: scale(4); opacity: 0;   }
}
.sc-spicy .sc-emoji { animation: spicy-twitch 0.28s ease-in-out infinite alternate; filter: drop-shadow(0 0 8px rgba(255,100,0,0.7)); }
@keyframes spicy-twitch {
  from{transform:rotate(-4deg) scale(1)  }
  to  {transform:rotate(4deg)  scale(1.1)}

/* Bitter */

.sc-bitter .sc-tag { background: rgba(255,255,255,0.72); color: #4a4a4a; animation: tag-flicker 5s ease infinite; }
@keyframes tag-flicker { 0%,87%,100%{opacity:1} 90%,96%{opacity:0} 93%{opacity:1} }
.blood-flash {
  position: absolute;

  background: rgba(130,0,0,0);

}
@keyframes blood-flicker {

  91%        {background:rgba(130,0,0,0.06)}

.sc-bitter .sc-emoji { animation: horror-appear 5s ease infinite; }
.sc-bitter .scene-object { filter: drop-shadow(0 18px 28px rgba(0,0,0,0.32)); }
@keyframes horror-appear {

  80%,100%{opacity:0; transform:scale(0.6) rotate(8deg)  }

@keyframes news-strobe { 50%{ background: #ffee00; } }

}

// ─── App state ────────────────────────────────────────

let phase      = 'normal';

// Scrub state

let scrubStartX  = 0;
let scrubStartY  = 0;
let scrubMoved   = 0;    // accumulated distance in current stroke

// ─── DOM ──────────────────────────────────────────────

const brainSvg   = document.getElementById('brainSvg');
const brainImg   = document.getElementById('brainImg');
const stateBadge = document.getElementById('stateBadge');
const msgEl      = document.getElementById('msgEl');
const heroWord   = document.getElementById('heroWord');
const dotsEl     = document.getElementById('dotsEl');
const glowEl     = document.getElementById('glow');

const gs2        = document.getElementById('gs2');

                    'rf1','rf2','rf3','rf4','rf5','rf6','rf7'];

brainImg.addEventListener('load', () => {
  brainImg.classList.add('is-loaded');
  brainSvg.classList.remove('fallback-visible');
});
brainImg.addEventListener('error', () => {
  brainImg.hidden = true;
  brainSvg.classList.add('fallback-visible');
});

function setCharacterImage(nextPhase) {
  const src = CHARACTER_IMAGES[nextPhase] || CHARACTER_IMAGES.normal;
  if (brainImg.dataset.src === src && brainImg.src) return;
  brainImg.dataset.src = src;
  brainImg.hidden = false;
  brainImg.classList.remove('is-loaded');
  brainImg.src = src;
}

setCharacterImage(phase);

brainEl.addEventListener('dragstart', e => {
  e.preventDefault();
});

// ─── Tabs ─────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;

    // Update buttons
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    // Update panels
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
    document.getElementById(`panel-${tab}`).classList.remove('hidden');

    showerMode = (tab === 'shower');

    if (showerMode) {
      brainEl.classList.add('scrub-mode');
    } else {
      brainEl.classList.remove('scrub-mode');
      hideBrush();
      // Reset partial progress on tab switch
      strokeCount = 0;
      updateStrokeDots();
    }
  });
});

// ─── Build feed dots ──────────────────────────────────
function buildDots() {
  dotsEl.innerHTML = '';
  for (let i = 0; i < ROTTEN_AT; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i < feeds ? ' ' + STATES[phase].dotClass : '');
    dotsEl.appendChild(d);
  }
}

// ─── Apply brain visual state ──────────────────────────
function applyState() {
  phase = feeds >= ROTTEN_AT ? 'rotten' : feeds >= STIM_AT ? 'overstimulated' : 'normal';
  const s = STATES[phase];

  gs1.setAttribute('stop-color', s.gs1);
  gs2.setAttribute('stop-color', s.gs2);
  foldIds.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.setAttribute('stroke', s.fold);
  });
  brainSvg.style.filter = `drop-shadow(0 10px 28px ${s.shadow})`;
  document.getElementById('mouth').setAttribute('d', s.mouth);
  document.getElementById('mouth').setAttribute('stroke', s.mouthStroke);
  document.getElementById('blL').setAttribute('fill', s.blush);
  document.getElementById('blL').setAttribute('opacity', s.blushOp);
  document.getElementById('blR').setAttribute('fill', s.blush);
  document.getElementById('blR').setAttribute('opacity', s.blushOp);
  ['eyeL','eyeR'].forEach(id => {
    const el = document.getElementById(id);
    el.setAttribute('rx', s.eyeRx); el.setAttribute('ry', s.eyeRy);
  });
  ['pupL','pupR'].forEach(id => {
    const el = document.getElementById(id);
    el.setAttribute('r', s.pupR); el.setAttribute('cy', s.pupCy);
  });
  stateBadge.textContent = s.badge;
  stateBadge.style.color = s.badgeColor;
  setCharacterImage(phase);
  glowEl.style.background = `radial-gradient(ellipse, ${s.glowBg} 0%, rgba(0,0,0,0.035) 48%, transparent 72%)`;
  brainEl.className = brainEl.className.replace(/state-\S+/g, '').trim();
  brainEl.classList.add(`state-${phase}`);
  if (showerMode) brainEl.classList.add('scrub-mode');
  buildDots();
}

// ─── Stroke progress dots ─────────────────────────────
function updateStrokeDots() {
  spDots.forEach((dot, i) => {
    dot.classList.toggle('filled', i < strokeCount);
  });
}

// ─── Scene icon physics ───────────────────────────────
const scenePhysics = {
  raf: 0,
  type: 'idle',
  bodies: [],
  pointer: { x: -9999, y: -9999, active: false },
  stop() {
    cancelAnimationFrame(this.raf);
    this.raf = 0;
    this.bodies = [];
  },
  start(type) {
    this.stop();
    this.type = type;
    const rect = mScreen.getBoundingClientRect();
    this.bodies = [...mScreen.querySelectorAll('[data-scene-icon]')].map((el, i) => {
      const x = rect.width * Number(el.dataset.x) / 100;
      const y = rect.height * Number(el.dataset.y) / 100;
      const size = Number(el.dataset.size || 1);
      return {
        el,
        homeX: x,
        homeY: y,
        x,
        y,
        vx: (Math.sin(i * 2.1) * 0.55),
        vy: (Math.cos(i * 1.7) * 0.55),
        r: 34 * size,
        size,
        seed: i * 0.73,
      };
    });
    if (!this.bodies.length) return;
    this.tick(performance.now());
  },
  tick(now) {
    const rect = mScreen.getBoundingClientRect();
    const t = now / 1000;

    for (const b of this.bodies) {
      let ax = (b.homeX - b.x) * 0.003;
      let ay = (b.homeY - b.y) * 0.003;

      if (this.type === 'salty') {
        ax += Math.sin(t * 0.9 + b.seed) * 0.018;
        ay += 0.022;
      } else if (this.type === 'sweet') {
        ax += Math.sin(t * 2.2 + b.seed) * 0.05;
        ay += Math.cos(t * 3.3 + b.seed) * 0.08;
      } else if (this.type === 'spicy') {
        ax += (Math.random() - 0.5) * 0.32;
        ay += (Math.random() - 0.5) * 0.32;
      } else if (this.type === 'bitter') {
        ax += Math.sin(t * 0.7 + b.seed) * 0.016;
        ay += Math.cos(t * 0.55 + b.seed) * 0.012;
      } else if (this.type === 'sour') {
        const kick = Math.sin(t * 8 + b.seed);
        ax += Math.sign(kick) * 0.055;
        ay += Math.cos(t * 7 + b.seed) * 0.055;
      } else if (this.type === 'shower') {
        ax += Math.sin(t * 0.8 + b.seed) * 0.018;
        ay += Math.cos(t * 0.9 + b.seed) * 0.018;
      }

      if (this.pointer.active) {
        const px = this.pointer.x - rect.left;
        const py = this.pointer.y - rect.top;
        const dx = b.x - px;
        const dy = b.y - py;
        const d2 = dx * dx + dy * dy;
        const range = this.type === 'spicy' || this.type === 'sour' ? 190 : 150;
        if (d2 < range * range) {
          const d = Math.sqrt(d2) || 1;
          const push = (1 - d / range) * (this.type === 'spicy' ? 2.8 : this.type === 'sour' ? 2.2 : 1.6);
          b.vx += (dx / d) * push;
          b.vy += (dy / d) * push;
        }
      }

      b.vx = (b.vx + ax) * 0.93;
      b.vy = (b.vy + ay) * 0.93;
      b.x += b.vx;
      b.y += b.vy;

      if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx) * 0.72; }
      if (b.x > rect.width - b.r) { b.x = rect.width - b.r; b.vx = -Math.abs(b.vx) * 0.72; }
      if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy) * 0.72; }
      if (b.y > rect.height - b.r) { b.y = rect.height - b.r; b.vy = -Math.abs(b.vy) * 0.72; }

      const rot = Math.max(-18, Math.min(18, b.vx * 3));
      const scalePulse =
        this.type === 'sweet' ? 1 + Math.sin(t * 4 + b.seed) * 0.08 :
        this.type === 'spicy' ? 1 + Math.sin(t * 14 + b.seed) * 0.06 :
        this.type === 'sour' ? 1 + Math.max(0, Math.sin(t * 8 + b.seed)) * 0.12 :
        1;
      const opacity =
        this.type === 'bitter' ? 0.22 + Math.max(0, Math.sin(t * 2.8 + b.seed)) * 0.62 :
        this.type === 'salty' ? 0.7 :
        0.82;
      b.el.style.opacity = opacity.toFixed(3);
      b.el.style.transform = `translate3d(${b.x - b.homeX}px, ${b.y - b.homeY}px, 0) rotate(${rot}deg) scale(${(b.size * scalePulse).toFixed(3)})`;
    }
    this.raf = requestAnimationFrame(this.tick.bind(this));
  },
  nudge(clientX, clientY, strength = 7) {
    const rect = mScreen.getBoundingClientRect();
    const px = clientX - rect.left;
    const py = clientY - rect.top;
    for (const b of this.bodies) {
      const dx = b.x - px;
      const dy = b.y - py;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      if (d < 170) {
        const hit = (1 - d / 170) * strength;
        b.vx += (dx / d) * hit;
        b.vy += (dy / d) * hit;
      }
    }
  },
};

document.addEventListener('pointermove', e => {
  scenePhysics.pointer.x = e.clientX;
  scenePhysics.pointer.y = e.clientY;
  scenePhysics.pointer.active = true;
});
document.addEventListener('pointerdown', e => {
  scenePhysics.pointer.x = e.clientX;
  scenePhysics.pointer.y = e.clientY;
  scenePhysics.pointer.active = true;
  scenePhysics.nudge(e.clientX, e.clientY, 9);
});
document.addEventListener('pointerleave', () => {
  scenePhysics.pointer.active = false;
});

// ─── Monitor scene renderer ───────────────────────────
function renderScene(type) {
  monitorEl.classList.add('visible');
  scenePhysics.stop();

  function rain(n) {
    let h = '';
    for (let i = 0; i < n; i++) {
      const l = Math.random() * 94;
      const t = Math.random() * 100;
      const d = 0.45 + Math.random() * 0.7;
      const dl = Math.random() * 1.8;
      h += `<div class="drop" style="left:${l}%;top:${t}%;animation-duration:${d}s;animation-delay:-${dl}s"></div>`;
    }
    return h;
  }

  function fireworks(n) {
    const cols = ['#ff6b9d','#ffd700','#7bed9f','#70a1ff','#ff4757','#eccc68','#ff9f43'];
    let h = '';
    for (let i = 0; i < n; i++) {
      const l = 5 + Math.random() * 85, t = 5 + Math.random() * 80;
      const sz = 18 + Math.random() * 22, d = 0.7 + Math.random() * 0.7, dl = Math.random() * 2.5;
      h += `<div class="firework" style="left:${l}%;top:${t}%;width:${sz}px;height:${sz}px;background:radial-gradient(circle,${cols[i%cols.length]},transparent);animation-duration:${d}s;animation-delay:${dl}s"></div>`;
    }
    return h;
  }

  function objects(items) {
    return items.map((it, i) => {
      const cls = it.cls || 'scene-bubble';
      const size = it.size || 1;
      return `<div class="scene-object ${cls}" data-scene-icon data-x="${it.x}" data-y="${it.y}" data-size="${size}" data-seed="${i}" style="left:${it.x}%;top:${it.y}%">${it.text}</div>`;
    }).join('');

// ─── Reaction message ─────────────────────────────────
let msgTimer;
function showMsg(text) {
  clearTimeout(msgTimer);
  msgEl.textContent = text;
  msgEl.classList.add('show');
  msgTimer = setTimeout(() => msgEl.classList.remove('show'), 2600);
}

let heroTypeTimer;
const HERO_MSG_CLASSES = ['msg-salty', 'msg-sweet', 'msg-spicy', 'msg-bitter', 'msg-sour'];
function typeHero(text, layoutType) {
  clearTimeout(heroTypeTimer);
  heroWord.textContent = '';
  heroWord.classList.toggle('is-message', text !== 'Brain Shower');
  heroWord.classList.remove(...HERO_MSG_CLASSES);
  if (layoutType && HERO_MSG_CLASSES.includes(`msg-${layoutType}`)) {
    heroWord.classList.add(`msg-${layoutType}`);
  }
  heroWord.classList.add('is-typing');

  let i = 0;
  const tick = () => {
    heroWord.textContent = text.slice(0, i);
    if (i < text.length) {
      i++;
      heroTypeTimer = setTimeout(tick, 52);
    } else {
      heroTypeTimer = setTimeout(() => {
        heroWord.classList.remove('is-typing');
      }, 900);
    }
  };
  tick();
}

// ─── Ripple ───────────────────────────────────────────
function spawnRipple(color) {
  const r = document.createElement('div');
  r.className = 'ripple';
  r.style.color = color;
  brainEl.appendChild(r);
  setTimeout(() => r.remove(), 700);
}

// ─── Brain anim ───────────────────────────────────────
function triggerAnim(name) {
  brainEl.className = brainEl.className.replace(/do-\S+/g, '').trim();
  void brainEl.offsetWidth;
  brainEl.classList.add(`do-${name}`);
  setTimeout(() => {
    brainEl.classList.remove(`do-${name}`);
    if (showerMode) brainEl.classList.add('scrub-mode');
  }, 950);
}

// ─── Feed (food) ──────────────────────────────────────
function feed(type) {
  const cfg = FOOD[type];
  if (!cfg) return;
  renderScene(type);
  if (feeds < ROTTEN_AT) feeds++;
  applyState();
  triggerAnim(cfg.anim);
  spawnRipple(STATES[phase].fold);
  showMsg(cfg.msg);
  typeHero(FOOD_TITLES[type] || 'Brain Shower', type);
  glowEl.style.background = `radial-gradient(ellipse, ${cfg.glow} 0%, rgba(0,0,0,0.035) 48%, transparent 72%)`;
}

// ─── Clean brain (shower complete) ───────────────────
function triggerClean() {
  feeds = 0;
  applyState();
  triggerAnim('shower');
  spawnRipple('#4dd0e1');
  renderScene('shower');
  typeHero('Brain Shower');
  brainSvg.style.filter = 'drop-shadow(0 10px 36px rgba(77,208,225,0.75))';
  setTimeout(() => {
    brainSvg.style.filter = `drop-shadow(0 10px 28px ${STATES[phase].shadow})`;
  }, 1200);
  showMsg('🧘 마음이 맑아졌어요.');
  glowEl.style.background = 'radial-gradient(ellipse, rgba(77,208,225,0.18) 0%, rgba(0,0,0,0.035) 48%, transparent 72%)';
  strokeCount = 0;
  updateStrokeDots();
}

// ─── Brush cursor ─────────────────────────────────────
// Total brush height ≈ 80px. We position so bristle tips (bottom) sit at cursor.
const BRUSH_H = 80; // handle(50) + ferrule(8) + head(22)

function moveBrush(x, y, dx) {
  // Tilt follows movement direction
  if      (dx >  4) brushAngle = brushAngle * 0.6 + 22 * 0.4;
  else if (dx < -4) brushAngle = brushAngle * 0.6 - 22 * 0.4;
  else              brushAngle = brushAngle * 0.85;

  brushEl.style.left      = x + 'px';
  brushEl.style.top       = (y - BRUSH_H) + 'px';
  brushEl.style.transform = `translateX(-50%) rotate(${brushAngle}deg)`;
  brushEl.style.transformOrigin = 'bottom center';
}

function showBrush() { brushEl.classList.add('show'); }
function hideBrush() { brushEl.classList.remove('show'); }

// ─── Foam particles ───────────────────────────────────
function spawnFoam(x, y) {
  const now = Date.now();
  if (now - foamThrottle < 35) return;
  foamThrottle = now;

  for (let i = 0; i < 2; i++) {
    const dot = document.createElement('div');
    dot.className = 'foam-dot';
    const size = 3 + Math.random() * 9;
    const ox   = (Math.random() - 0.5) * 32;
    const oy   = (Math.random() - 0.5) * 20;
    const dur  = 0.7 + Math.random() * 0.4;
    dot.style.cssText =
      `left:${x + ox - size/2}px;top:${y + oy - size/2}px;` +
      `width:${size}px;height:${size}px;animation-duration:${dur}s`;
    document.body.appendChild(dot);
    setTimeout(() => dot.remove(), dur * 1000);
  }
}

// ─── Scrub interaction ────────────────────────────────

// Show brush on hover (shower mode only)
brainEl.addEventListener('pointerenter', e => {
  if (!showerMode) return;
  showBrush();
  moveBrush(e.clientX, e.clientY, 0);
});

brainEl.addEventListener('pointerleave', e => {
  if (!isScrubbing) hideBrush();
});

// Pointer down → start stroke
brainEl.addEventListener('pointerdown', e => {
  if (!showerMode) return;
  e.preventDefault();
  isScrubbing = true;
  scrubStartX = e.clientX;
  scrubStartY = e.clientY;
  scrubMoved  = 0;
  lastPtrX    = e.clientX;
  brainEl.classList.add('scrubbing');
  brainEl.setPointerCapture(e.pointerId);

  // Show shower scene on monitor as soon as scrubbing starts
  renderScene('shower');
});

// Pointer move → update brush + foam + measure distance
document.addEventListener('pointermove', e => {
  if (showerMode) e.preventDefault();
  if (showerMode) {
    const dx = e.clientX - lastPtrX;
    moveBrush(e.clientX, e.clientY, dx);
    lastPtrX = e.clientX;
  }
  if (!isScrubbing) return;

  const dx = e.clientX - scrubStartX;
  const dy = e.clientY - scrubStartY;
  scrubMoved = Math.sqrt(dx * dx + dy * dy);
  spawnFoam(e.clientX, e.clientY);
});

// Pointer up → evaluate stroke
document.addEventListener('pointerup', e => {
  if (!isScrubbing) return;
  isScrubbing = false;
  brainEl.classList.remove('scrubbing');

  if (scrubMoved >= MIN_SWIPE_PX) {
    strokeCount = Math.min(strokeCount + 1, STROKES_NEEDED);
    updateStrokeDots();

    if (strokeCount >= STROKES_NEEDED) {
      triggerClean();
    }
  }

  // Hide brush if pointer left the brain
  const r = brainEl.getBoundingClientRect();
  if (e.clientX < r.left || e.clientX > r.right ||
      e.clientY < r.top  || e.clientY > r.bottom) {
    hideBrush();
  }
});

// ─── Food drag & drop ─────────────────────────────────
let dragType  = null;
let dragGhost = null;

document.querySelectorAll('.food-item').forEach(item => {
  // Click to feed (fallback for all platforms)
  item.addEventListener('click', () => {
    if (showerMode) return;
    feed(item.dataset.type);
  });

  item.addEventListener('dragstart', e => {
    dragType = item.dataset.type;
    e.dataTransfer.effectAllowed = 'copy';
    dragGhost = document.createElement('div');
    dragGhost.className = 'drag-ghost';
    dragGhost.textContent = item.querySelector('.food-icon').textContent.trim();
    document.body.appendChild(dragGhost);
    // Use a canvas in the DOM to suppress default drag image (Firefox-compatible)
    const blank = document.createElement('canvas');
    blank.width = blank.height = 1;
    document.body.appendChild(blank);
    e.dataTransfer.setDragImage(blank, 0, 0);
    requestAnimationFrame(() => blank.remove());
  });
  item.addEventListener('dragend', () => {
    dragGhost?.remove(); dragGhost = null;
    brainEl.classList.remove('drag-over');
  });
});

document.addEventListener('dragover', e => {
  if (dragGhost) {
    dragGhost.style.left = (e.clientX - 22) + 'px';
    dragGhost.style.top  = (e.clientY - 22) + 'px';
  }
});

brainEl.addEventListener('dragover',  e => {
  if (showerMode) return;
  e.preventDefault();
  brainEl.classList.add('drag-over');
});
brainEl.addEventListener('dragleave', () => brainEl.classList.remove('drag-over'));
brainEl.addEventListener('drop', e => {
  e.preventDefault();
  brainEl.classList.remove('drag-over');
  if (dragType && !showerMode) feed(dragType);
});

// ─── Touch drag (food) ────────────────────────────────
let touchType  = null;
let touchGhost = null;

document.querySelectorAll('.food-item').forEach(item => {
  item.addEventListener('touchstart', e => {
    touchType = item.dataset.type;
    const t = e.touches[0];
    touchGhost = document.createElement('div');
    touchGhost.className = 'drag-ghost';
    touchGhost.textContent = item.querySelector('.food-icon').textContent.trim();
    touchGhost.style.left = (t.clientX - 22) + 'px';
    touchGhost.style.top  = (t.clientY - 22) + 'px';
    document.body.appendChild(touchGhost);
    e.preventDefault();
  }, { passive: false });

  item.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if (touchGhost) {
      touchGhost.style.left = (t.clientX - 22) + 'px';
      touchGhost.style.top  = (t.clientY - 22) + 'px';
    }
    const r = brainEl.getBoundingClientRect();
    brainEl.classList.toggle('drag-over',
      !showerMode &&
      t.clientX >= r.left && t.clientX <= r.right &&
      t.clientY >= r.top  && t.clientY <= r.bottom);
    e.preventDefault();
  }, { passive: false });

  item.addEventListener('touchend', e => {
    touchGhost?.remove(); touchGhost = null;
    const t = e.changedTouches[0];
    const r = brainEl.getBoundingClientRect();
    if (!showerMode &&
        t.clientX >= r.left && t.clientX <= r.right &&
        t.clientY >= r.top  && t.clientY <= r.bottom) feed(touchType);
    brainEl.classList.remove('drag-over');
    touchType = null;
  });
});

// ─── Init ─────────────────────────────────────────────
applyState();
</script>
</body>
</html>
